<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hạt & Nếp - Quản lý kho</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f5f6f2;color:#24352c}header{background:#28513d;color:#fff;padding:18px 24px;font-size:24px;font-weight:700}.wrap{display:flex;min-height:calc(100vh - 64px)}nav{width:230px;background:#fff;padding:14px;border-right:1px solid #ddd}nav button{width:100%;padding:12px;margin:4px 0;border:0;border-radius:8px;text-align:left;cursor:pointer;background:#f1f4f1;font-size:15px}nav button:hover{background:#dfe9e2}main{padding:28px;flex:1}.cards{display:flex;gap:15px;flex-wrap:wrap}.card{background:#fff;padding:20px;border-radius:12px;min-width:180px;box-shadow:0 2px 8px #0001}.big{font-size:28px;font-weight:700}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:#fff;padding:18px;border-radius:12px}.form div{display:flex;flex-direction:column;gap:5px}input,select{padding:10px;border:1px solid #bbb;border-radius:7px;font-size:15px;background:#fff}.btn{margin-top:14px;background:#28513d;color:#fff;border:0;padding:11px 18px;border-radius:8px;cursor:pointer;font-size:15px}.btn:hover{background:#1d3e2e}table{width:100%;background:#fff;border-collapse:collapse;margin-top:16px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left}th{background:#edf2ee}.note{background:#fff;padding:12px;border-radius:10px;margin:10px 0}.danger{color:#a33;font-weight:600}.low-stock,.low-stock td{background:#ffe1e1!important;color:#9b1c1c}.chart{display:flex;align-items:flex-end;gap:10px;min-height:240px;background:#fff;padding:18px;border-radius:12px;overflow-x:auto}.barItem{min-width:48px;height:210px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.barValue{font-size:11px;margin-bottom:5px;white-space:nowrap}.barTrack{height:170px;width:28px;display:flex;align-items:flex-end}.barFill{width:100%;background:#28513d;border-radius:6px 6px 0 0;min-height:3px}.barLabel{font-size:11px;margin-top:6px}.warning-legend{display:flex;gap:18px;flex-wrap:wrap;background:#fff3f3;border:1px solid #f1caca;padding:10px 12px;border-radius:10px;margin:10px 0}.warning-legend b{color:#9b1c1c}.ok{color:#1b6b3a;font-weight:600}@media(max-width:800px){.form{grid-template-columns:1fr}.wrap{flex-direction:column}nav{width:auto}main{padding:15px}}
</style></head>
<body>
<header>🌿 HẠT & NẾP — QUẢN LÝ KHO</header>
<div class="wrap"><nav>
<button data-page="home">🏠 Tổng quan</button>
<button data-page="importMaterial">🌾 Nhập nguyên liệu</button>
<button data-page="exportMaterial">📤 Xuất nguyên liệu</button>
<button data-page="importSupply">🧰 Nhập đồ dùng</button>
<button data-page="importAsset">🏪 Nhập tài sản</button>
<button data-page="exportSupply">📤 Xuất đồ dùng</button>
<button data-page="exportAsset">📤 Xuất tài sản</button>
<button data-page="transfer">🔄 Chuyển kho</button>
<button data-page="importProduct">🥤 Nhập thành phẩm</button>
<button data-page="exportProduct">📤 Xuất thành phẩm</button>
<button data-page="stock">📊 Tồn kho</button>
<button data-page="history">📜 Lịch sử</button>
<button data-page="cost">🧮 Tính Cost</button>
<button data-page="revenue">💰 Doanh thu</button>
</nav><main id="app"></main></div>
<script>
'use strict';
let stock=[]; let hist=[]; let recipes=[];
try{recipes=JSON.parse(localStorage.getItem('recipes')||'[]');if(!Array.isArray(recipes))recipes=[];}catch(e){recipes=[];}
function saveRecipes(){try{localStorage.setItem('recipes',JSON.stringify(recipes));return true;}catch(e){alert('Không thể lưu công thức trên trình duyệt.');return false;}}
try{stock=JSON.parse(localStorage.getItem('stock')||'[]');if(!Array.isArray(stock))stock=[];}catch(e){stock=[];}
try{hist=JSON.parse(localStorage.getItem('hist')||'[]');if(!Array.isArray(hist))hist=[];}catch(e){hist=[];}
stock=stock.map(x=>({...x,category:x.category||'nguyenlieu',maxQty:Number(x.maxQty||x.qty||0)}));
function save(){try{localStorage.setItem('stock',JSON.stringify(stock));localStorage.setItem('hist',JSON.stringify(hist));return true;}catch(e){alert('Không thể lưu dữ liệu trên trình duyệt. Hãy mở bằng Chrome/Edge và thử lại.');return false;}}
function today(){let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pageTitle(cat,mode){if(mode==='import')return cat==='dodung'?'🧰 Nhập đồ dùng':cat==='taisan'?'🏪 Nhập tài sản':cat==='thanhpham'?'🥤 Nhập thành phẩm':'🌾 Nhập nguyên liệu';return cat==='dodung'?'📤 Xuất / sử dụng đồ dùng':cat==='taisan'?'📤 Xuất tài sản':cat==='thanhpham'?'📤 Xuất thành phẩm':'📤 Xuất / sử dụng nguyên liệu';}
function formImport(cat){let label=cat==='dodung'?'đồ dùng':cat==='taisan'?'tài sản':cat==='thanhpham'?'thành phẩm':'nguyên liệu';let placeholder=cat==='dodung'?'Ly nhựa, nắp, ống hút...':cat==='taisan'?'Cân điện tử, máy xay, bình...':cat==='thanhpham'?'Sữa hạt, sữa chua, trà sữa...':'Hạt óc chó, hạt sen...';let nameField=cat==='thanhpham'&&recipes.length?`<select id="name" required><option value="">-- Chọn thành phẩm từ Tính Cost --</option>${recipes.map(r=>`<option value="${esc(r.name)}">${esc(r.name)}${Number(r.sell||0)?' — giá bán '+Number(r.sell).toLocaleString('vi-VN')+' ₫':''}</option>`).join('')}</select>`:`<input id="name" required placeholder="${placeholder}">`;return `<h2>${pageTitle(cat,'import')}</h2>${cat==='thanhpham'&&recipes.length?'<div class="note">Tên thành phẩm được lấy từ 🧮 Tính Cost để tránh nhập sai tên.</div>':''}<form id="importForm" class="form"><div>Tên ${label}${nameField}</div><div>Số lượng<input id="qty" type="number" min="0.01" step="0.01" required></div><div>Đơn vị<input id="unit" required placeholder="${cat==='dodung'||cat==='taisan'?'cái, bộ, chiếc...':'kg, lít, chai...' }"></div><div>Tổng tiền nhập (VNĐ)<input id="price" type="number" min="0" step="1" value="0" placeholder="Ví dụ 110000 cho 5000g"></div><div>Nhà cung cấp<input id="sup" placeholder=""></div>${cat==='nguyenlieu'||cat==='thanhpham'?'<div>Hạn sử dụng<input id="expiry" type="date"></div>':''}<div>Ghi chú<input id="note" placeholder=""></div><div>Ngày nhập<input id="date" type="date" value="${today()}" required></div></form><button type="button" class="btn" id="saveImport">💾 Lưu phiếu nhập</button><div id="msg"></div>`;}
function formExport(cat){let arr=stock.map((x,i)=>({...x,_i:i})).filter(x=>x.category===cat);if(cat==='thanhpham'){if(!recipes.length)return `<h2>${pageTitle(cat,'export')}</h2><div class="note">Chưa có thành phẩm trong 🧮 Tính Cost. Hãy tạo Cost trước.</div>`;let opts=recipes.map(r=>{let idx=stock.findIndex(x=>x.category==='thanhpham'&&x.name===r.name);let x=idx>=0?stock[idx]:null;return `<option value="${idx}">${esc(r.name)}${x?' — tồn '+x.qty+' '+esc(x.unit||''):' — chưa có trong kho'}</option>`}).join('');return `<h2>${pageTitle(cat,'export')}</h2><div class="note">Tên thành phẩm được lấy tự động từ 🧮 Tính Cost. Giá bán cũng lấy từ Cost để tính doanh thu.</div><form id="exportForm" class="form"><div>Thành phẩm<select id="item" required><option value="">-- Chọn thành phẩm --</option>${opts}</select></div><div>Số lượng xuất (ly)<input id="outQty" type="number" min="1" step="1" required placeholder="Ví dụ: 13"></div><div>Ngày xuất<input id="outDate" type="date" value="${today()}" required></div></form><button type="button" class="btn" id="saveExport">📤 Xuất thành phẩm</button><div id="msg"></div>`}if(!arr.length)return `<h2>${pageTitle(cat,'export')}</h2><div class="note">Chưa có mặt hàng trong kho này. Hãy nhập trước.</div>`;return `<h2>${pageTitle(cat,'export')}</h2><form id="exportForm" class="form"><div>${cat==='dodung'?'Đồ dùng':cat==='taisan'?'Tài sản':'Nguyên liệu'}<select id="item" required>${arr.map(x=>`<option value="${x._i}">${esc(x.name)} — tồn ${x.qty} ${esc(x.unit||'')}</option>`).join('')}</select></div><div>Số lượng<input id="outQty" type="number" min="0.01" step="0.01" required></div><div>Ngày xuất<input id="outDate" type="date" value="${today()}" required></div></form><button type="button" class="btn" id="saveExport">📤 Lưu xuất kho</button><div id="msg"></div><div id="dailyExportList" style="margin-top:18px"></div>`;}
function unitPrices(x){let u=(x.unit||'').toLowerCase().trim(), p=Number(x.price||0);let out='';if(u==='g'||u==='gram'||u==='gam'){out='100g: '+(p*100).toLocaleString('vi-VN')+' ₫ | 1kg: '+(p*1000).toLocaleString('vi-VN')+' ₫';}else if(u==='kg'||u==='kilogram'){out='100g: '+(p/10).toLocaleString('vi-VN')+' ₫ | 1kg: '+p.toLocaleString('vi-VN')+' ₫';}else if(u==='ml'){out='100ml: '+(p*100).toLocaleString('vi-VN')+' ₫ | 1L: '+(p*1000).toLocaleString('vi-VN')+' ₫';}else if(u==='l'||u==='lit'||u==='lít'){out='100ml: '+(p/10).toLocaleString('vi-VN')+' ₫ | 1L: '+p.toLocaleString('vi-VN')+' ₫';}else if(p>0){out='1 '+esc(x.unit||'đơn vị')+': '+p.toLocaleString('vi-VN')+' ₫';}return out;}
function stockWarning(x){if(x.category!=='nguyenlieu')return false;let qty=Number(x.qty||0);let max=Number(x.maxQty||0);let low=max>0 ? qty<=max*0.2 : qty<=0;let exp=false;if(x.expiry){let d=new Date(x.expiry+'T23:59:59');if(!isNaN(d))exp=(d-new Date())<=7*86400000;}return low||exp;}
function warningText(x){if(x.category!=='nguyenlieu')return '';let a=[];let qty=Number(x.qty||0),max=Number(x.maxQty||0);if(max>0&&qty<=max*0.2)a.push('Gần hết');if(x.expiry){let d=new Date(x.expiry+'T23:59:59');if(!isNaN(d)){let days=Math.ceil((d-new Date())/86400000);if(days<0)a.push('Đã hết hạn');else if(days<=7)a.push('Sắp hết hạn');}}return a.join(' • ');}
function table(arr){if(!arr.length)return '<div class="note">Chưa có dữ liệu.</div>';return `<table><tr><th>Tên</th><th>Tồn</th><th>Đơn vị</th><th>Giá trị tồn (VNĐ)</th><th>Giá theo đơn vị</th><th>Hạn sử dụng</th><th>Nhà cung cấp</th><th>Ghi chú</th><th>Sửa</th></tr>${arr.map(x=>{let total=Number(x.totalCost);if(!Number.isFinite(total))total=Number(x.qty||0)*Number(x.price||0);let warn=stockWarning(x);let wt=warningText(x);return `<tr class="${warn?'low-stock':''}"><td><b>${esc(x.name)}</b>${wt?`<div class="danger" style="font-size:12px;margin-top:3px">⚠️ ${esc(wt)}</div>`:''}</td><td>${(['chai','cái','binh','bình','hộp','bộ','chiếc'].includes((x.unit||'').toLowerCase().trim()) ? Number(x.qty||0).toLocaleString('vi-VN',{maximumFractionDigits:0}) : Number(x.qty||0).toLocaleString('vi-VN',{maximumFractionDigits:3}))}</td><td>${esc(x.unit||'')}</td><td>${total.toLocaleString('vi-VN')} ₫</td><td>${unitPrices(x)}</td><td>${esc(x.expiry||'')}</td><td>${esc(x.sup||'')}</td><td>${esc(x.note||'')}</td><td><button type="button" class="editStock" data-i="${stock.indexOf(x)}">✏️ Sửa</button> <button type="button" class="deleteStock" data-i="${stock.indexOf(x)}">🗑️ Xóa</button> <button type="button" class="moveStock" data-i="${stock.indexOf(x)}">🔄 Chuyển</button></td></tr>`}).join('')}</table>`;}
function unitGroup(u){u=(u||'').toLowerCase().trim();if(['g','gram','gam','kg','kilogram'].includes(u))return 'weight';if(['ml','l','lit','lít'].includes(u))return 'volume';return 'count';}
function unitToBase(q,u){u=(u||'').toLowerCase().trim();q=Number(q)||0;if(['kg','kilogram'].includes(u))return {group:'weight',base:q*1000};if(['g','gram','gam'].includes(u))return {group:'weight',base:q};if(['l','lit','lít'].includes(u))return {group:'volume',base:q*1000};if(u==='ml')return {group:'volume',base:q};return {group:'count',base:q};}
function baseToStock(base,u){u=(u||'').toLowerCase().trim();if(['kg','kilogram'].includes(u))return base/1000;if(['g','gram','gam'].includes(u))return base;if(['l','lit','lít'].includes(u))return base/1000;if(u==='ml')return base;return base;}
function costForQty(m,q,recipeUnit){let stockUnit=(m.unit||'').toLowerCase().trim(),ru=(recipeUnit||stockUnit).toLowerCase().trim(),price=Number(m.price||0);if(!q||!price)return 0;if(unitGroup(stockUnit)!==unitGroup(ru))return null;let b=unitToBase(q,ru);let stockQty=baseToStock(b.base,stockUnit);return stockQty*price;}
function recipePage(){let mats=stock.filter(x=>x.category==='nguyenlieu'||x.category==='dodung');return `<h2>🧮 Tính Cost thành phẩm</h2><div class="note">Tạo công thức cho từng món. Bạn có thể chọn <b>đơn vị sử dụng</b> riêng cho từng nguyên liệu. Ví dụ sữa nhập theo <b>lít</b> nhưng công thức dùng <b>ml</b>: 200 ml sẽ tự quy đổi thành 0,2 lít.</div><div class="form"><div>Tên thành phẩm<input id="recipeName" placeholder="Ví dụ: Sữa hạt sen 500ml"></div><div>Giá bán dự kiến (VNĐ)<input id="recipeSell" type="number" min="0" step="1" value="0"></div><div>Số lượng thành phẩm<input id="recipeYield" type="number" min="1" step="1" value="1"></div></div><h3>⚡ Chi phí sản xuất khác</h3><div class="form"><div>🔥 Tiền gas / mẻ<input id="recipeGas" type="number" min="0" step="1" value="0"></div><div>💡 Tiền điện / mẻ<input id="recipeElectric" type="number" min="0" step="1" value="0"></div><div>🧊 Tiền đá / mẻ<input id="recipeIce" type="number" min="0" step="1" value="0"></div><div>🧂 Tiền muối / mẻ<input id="recipeSalt" type="number" min="0" step="1" value="0"></div><div>💧 Tiền nước lọc / mẻ<input id="recipeWater" type="number" min="0" step="1" value="0"></div></div><div class="note">Các khoản này tính theo <b>1 mẻ công thức</b> và sẽ được cộng vào giá vốn.</div><h3>Nguyên liệu / vật tư</h3><div id="recipeRows"></div><button type="button" class="btn" id="addRecipeRow">➕ Thêm nguyên liệu</button> <button type="button" class="btn" id="saveRecipe">💾 Lưu công thức</button><div id="costResult" class="note" style="margin-top:16px"></div><h3>Công thức đã lưu</h3>${recipes.length?`<table><tr><th>Thành phẩm</th><th>Cost/đơn vị</th><th>Giá bán</th><th>Lãi gộp</th><th>Biên lợi nhuận</th><th>Thao tác</th></tr>${recipes.map((r,i)=>{let c=Number(r.cost||0),sell=Number(r.sell||0),profit=sell-c,margin=sell>0?profit/sell*100:0;return `<tr><td>${esc(r.name)}</td><td>${c.toLocaleString('vi-VN')} ₫</td><td>${sell.toLocaleString('vi-VN')} ₫</td><td>${profit.toLocaleString('vi-VN')} ₫</td><td>${margin.toFixed(1)}%</td><td><button type="button" class="btn viewRecipe" data-i="${i}">👁️ Xem</button> <button type="button" class="btn editRecipe" data-i="${i}">✏️ Sửa</button> <button type="button" class="danger delRecipe" data-i="${i}">🗑️ Xoá</button></td></tr>`}).join('')}</table>`:'<div class="note">Chưa có công thức nào.</div>'}<div id="recipeDetails" class="note" style="margin-top:16px;display:none"></div>`;}
function bindCost(){let mats=stock.filter(x=>x.category==='nguyenlieu'||x.category==='dodung');let rows=document.getElementById('recipeRows'), result=document.getElementById('costResult');const units=['g','kg','ml','l','chai','cái','bình','hộp','bộ','chiếc'];function addRow(){let opts=mats.map((x,i)=>`<option value="${i}">${esc(x.name)} — ${Number(x.price||0).toLocaleString('vi-VN')} ₫/${esc(x.unit||'đv')}</option>`).join('');let d=document.createElement('div');d.className='form recipeRow';d.style.marginTop='10px';d.innerHTML=`<div>Nguyên liệu<select class="rItem">${opts||'<option value="-1">Chưa có nguyên liệu</option>'}</select></div><div>Số lượng dùng<input class="rQty" type="number" min="0" step="0.01" value="0"></div><div>Đơn vị dùng<select class="rUnit">${units.map(u=>`<option value="${u}">${u}</option>`).join('')}</select></div><div><button type="button" class="btn removeRow">🗑️ Bỏ dòng</button></div>`;rows.appendChild(d);let item=d.querySelector('.rItem'),unit=d.querySelector('.rUnit');function syncUnit(){let m=mats[Number(item.value)];if(m){let su=(m.unit||'').toLowerCase().trim();let match=units.find(u=>u===su);if(match)unit.value=match;else if(['kg','kilogram'].includes(su))unit.value='kg';else if(['g','gram','gam'].includes(su))unit.value='g';else if(['l','lit','lít'].includes(su))unit.value='l';else if(su==='ml')unit.value='ml';}}syncUnit();d.querySelector('.removeRow').addEventListener('click',()=>{d.remove();calc();});item.addEventListener('change',()=>{syncUnit();calc();});d.querySelector('.rQty').addEventListener('input',calc);unit.addEventListener('change',calc);calc();}function calc(){let total=0,invalid=[];document.querySelectorAll('.recipeRow').forEach(row=>{let m=mats[Number(row.querySelector('.rItem')?.value)],q=Number(row.querySelector('.rQty')?.value||0),u=row.querySelector('.rUnit')?.value;if(m&&q>0){let c=costForQty(m,q,u);if(c===null)invalid.push(m.name);else total+=c;}});let gas=Number(document.getElementById('recipeGas')?.value||0),electric=Number(document.getElementById('recipeElectric')?.value||0),ice=Number(document.getElementById('recipeIce')?.value||0),salt=Number(document.getElementById('recipeSalt')?.value||0);let water=Number(document.getElementById('recipeWater')?.value||0);let otherCost=gas+electric+ice+salt+water;let grandTotal=total+otherCost;let y=Math.max(1,Number(document.getElementById('recipeYield')?.value||1));let sell=Number(document.getElementById('recipeSell')?.value||0);let unitCost=grandTotal/y,profit=sell-unitCost,margin=sell>0?profit/sell*100:0;let batchCost=unitCost*y;result.innerHTML=`<b>Cost nguyên liệu:</b> ${total.toLocaleString('vi-VN')} ₫ &nbsp; | &nbsp; <b>Chi phí khác:</b> ${otherCost.toLocaleString('vi-VN')} ₫ &nbsp; | &nbsp; <b>Tổng cost mẻ:</b> ${grandTotal.toLocaleString('vi-VN')} ₫<br><b>Cost/1 thành phẩm:</b> ${unitCost.toLocaleString('vi-VN')} ₫ &nbsp; × &nbsp; <b>${y.toLocaleString('vi-VN')} thành phẩm</b> = <b>${batchCost.toLocaleString('vi-VN')} ₫</b> &nbsp; | &nbsp; <b>Giá bán/1:</b> ${sell.toLocaleString('vi-VN')} ₫ &nbsp; | &nbsp; <b>Lãi/1:</b> ${profit.toLocaleString('vi-VN')} ₫ &nbsp; | &nbsp; <b>Biên:</b> ${margin.toFixed(1)}%${invalid.length?`<br><span style="color:#b00">⚠️ Không quy đổi được đơn vị: ${invalid.map(esc).join(', ')}. Hãy chọn đúng nhóm đơn vị (g/kg hoặc ml/l).</span>`:''}`;return {total,otherCost,grandTotal,unitCost,sell,profit,margin,gas,electric,ice,salt,water};}addRow();document.getElementById('addRecipeRow').addEventListener('click',addRow);document.getElementById('recipeYield').addEventListener('input',calc);document.getElementById('recipeSell').addEventListener('input',calc);['recipeGas','recipeElectric','recipeIce','recipeSalt','recipeWater'].forEach(id=>document.getElementById(id).addEventListener('input',calc));document.getElementById('saveRecipe').addEventListener('click',()=>{let name=document.getElementById('recipeName').value.trim();if(!name)return alert('Vui lòng nhập tên thành phẩm.');let calcVal=calc();if(calcVal.uni ipes[i];if(!r)return;document.getElementById('recipeName').value=r.name||'';document.getElementById('recipeSell').value=Number(r.sell||0);document.getElementById('recipeYield').value=Number(r.yield||1);document.getElementById('recipeGas').value=Number(r.gas||0);document.getElementById('recipeElectric').value=Number(r.electric||0);document.getElementById('recipeIce').value=Number(r.ice||0);document.getElementById('recipeSalt').value=Number(r.salt||0);document.getElementById('recipeWater').value=Number(r.water||0);rows.innerHTML='';(r.items||[]).forEach(it=>{addRow();let row=rows.lastElementChild;let item=row.querySelector('.rItem'),unit=row.querySelector('.rUnit'),qty=row.querySelector('.rQty');let idx=mats.findIndex(m=>m.name===it.name);if(idx>=0)item.value=idx;qty.value=it.qty||0;unit.value=it.unit||it.stockUnit||unit.value;});let btn=document.getElementById('saveRecipe');btn.textContent='💾 Cập nhật công thức';btn.dataset.editIndex=i;calc();window.scrollTo({top:0,behavior:'smooth'});}));let saveBtn=document.getElementById('saveRecipe');saveBtn.addEventListener('click',()=>{if(saveBtn.dataset.editIndex===undefined)return;let i=Number(saveBtn.dataset.editIndex),name=document.getElementById('recipeName').value.trim();if(!name)return;let cv=calc(),items=[];document.querySelectorAll('.recipeRow').forEach(row=>{let m=mats[Number(row.querySelector('.rItem')?.value)],q=Number(row.querySelector('.rQty')?.value||0),u=row.querySelector('.rUnit')?.value;if(m&&q>0)items.push({name:m.name,qty:q,unit:u,stockUnit:m.unit});});recipes[i]={name,sell:cv.sell,yield:Number(document.getElementById('recipeYield').value||1),cost:cv.unitCost,rawCost:cv.total,otherCost:cv.otherCost,gas:cv.gas,electric:cv.electric,ice:cv.ice,salt:cv.salt,water:cv.water,items};saveRecipes();delete saveBtn.dataset.editIndex;saveBtn.textContent='💾 Lưu công thức';show('cost');alert('Đã cập nhật công thức.');});document.querySelectorAll('.delRecipe').forEach(b=>b.addEventListener('click',()=>{if(confirm('Xoá công thức này?')){recipes.splice(Number(b.dataset.i),1);saveRecipes();show('cost');}}));}

function revenuePage(){
  const month=today().slice(0,7);
  const sales=hist.filter(x=>x.category==='thanhpham'&&x.type==='Xuất/Sử dụng'&&String(x.date||'').slice(0,7)===month);
  const dailyQty={},dailyRevenue={},dailyCost={},byProduct={};
  sales.forEach(x=>{
    const d=x.date, q=Number(x.qty||0), r=recipes.find(z=>z.name===x.name);
    dailyQty[d]=(dailyQty[d]||0)+q;
    if(!byProduct[d])byProduct[d]={};
    byProduct[d][x.name]=(byProduct[d][x.name]||0)+q;
    if(r){dailyRevenue[d]=(dailyRevenue[d]||0)+q*Number(r.sell||0);dailyCost[d]=(dailyCost[d]||0)+q*Number(r.cost||0);}
  });
  const days=Array.from(new Set(Object.keys(dailyQty))).sort();
  const profit={};days.forEach(d=>profit[d]=Number(dailyRevenue[d]||0)-Number(dailyCost[d]||0));
  const totalRevenue=Object.values(dailyRevenue).reduce((a,b)=>a+b,0),totalQty=Object.values(dailyQty).reduce((a,b)=>a+b,0),totalCost=Object.values(dailyCost).reduce((a,b)=>a+b,0);
  const totalProfit=totalRevenue-totalCost;
  const maxRev=Math.max(1,...Object.values(dailyRevenue)),maxQty=Math.max(1,...Object.values(dailyQty)),maxProfit=Math.max(1,...Object.values(profit).map(v=>Math.abs(v)));
  const bars=(obj,max,unit)=>days.length?`<div class="chart">${days.map(d=>{const val=Number(obj[d]||0);return `<div class="barItem"><div class="barValue">${val.toLocaleString('vi-VN')}${unit}</div><div class="barTrack"><div class="barFill" style="height:${Math.max(3,Math.round((Math.abs(val)/max)*100))}%"></div></div><div class="barLabel">${esc(d.slice(8,10))}/${esc(d.slice(5,7))}</div></div>`}).join('')}</div>`:'<div class="note">Chưa có dữ liệu xuất thành phẩm trong tháng này.</div>';
  const detail=days.length?`<table><tr><th>Ngày</th><th>Chi tiết bán</th><th>Tổng số lượng</th><th>Doanh thu</th><th>Cost</th><th>Lợi nhuận</th></tr>${days.slice().reverse().map(d=>{const items=Object.entries(byProduct[d]||{}).map(([n,q])=>`${esc(n)}: ${q}`).join('<br>');const hasPrice=sales.filter(x=>x.date===d).every(x=>recipes.find(r=>r.name===x.name));const rev=Number(dailyRevenue[d]||0),cost=Number(dailyCost[d]||0),pr=rev-cost;return `<tr><td>${esc(d)}</td><td>${items||'-'}</td><td>${Number(dailyQty[d]||0).toLocaleString('vi-VN')}</td><td>${hasPrice?rev.toLocaleString('vi-VN')+' ₫':'Chưa có giá bán trong Cost'}</td><td>${hasPrice?cost.toLocaleString('vi-VN')+' ₫':'-'}</td><td>${hasPrice?pr.toLocaleString('vi-VN')+' ₫':'-'}</td></tr>`}).join('')}</table>`:'<div class="note">Chưa có dữ liệu.</div>';
  return `<h2>💰 Doanh thu & lợi nhuận</h2><div class="note">Doanh thu lấy từ <b>📤 Xuất thành phẩm</b>. <b>Cost</b> lấy từ <b>🧮 Tính Cost</b> (đã gồm nguyên liệu + gas + điện + đá + muối + nước lọc). <b>Lợi nhuận = Doanh thu − Cost thực tế của số ly đã bán.</b></div><div class="cards" style="margin-top:16px"><div class="card">💰 Doanh thu tháng<strong class="big">${totalRevenue.toLocaleString('vi-VN')} ₫</strong></div><div class="card">📦 Tổng sản phẩm bán<strong class="big">${totalQty.toLocaleString('vi-VN')}</strong></div><div class="card">🧾 Tổng Cost<strong class="big">${totalCost.toLocaleString('vi-VN')} ₫</strong></div><div class="card">📈 Lợi nhuận gộp<strong class="big">${totalProfit.toLocaleString('vi-VN')} ₫</strong></div></div><h3>📊 Doanh thu từng ngày</h3>${bars(dailyRevenue,maxRev,' ₫')}<h3>📦 Số lượng thành phẩm bán từng ngày</h3>${bars(dailyQty,maxQty,' sp')}<h3>📈 Lợi nhuận từng ngày = Doanh thu − Cost</h3>${bars(profit,maxProfit,' ₫')}<h3>📋 Chi tiết từng ngày</h3>${detail}`;
}

function deleteHistory(i){const item=hist[i];if(!item)return;const reason=prompt('Nhập nguyên nhân xoá lịch sử:');if(reason===null)return;if(!reason.trim())return alert('Bắt buộc phải nhập nguyên nhân.');const pass=prompt('Nhập mật khẩu quản lý để xoá:');if(pass===null)return;if(pass!=='123456')return alert('Mật khẩu không đúng. Không thể xoá.');hist.splice(i,1);save();show('history');alert('Đã xoá lịch sử. Nguyên nhân: '+reason.trim());}
function bindImport(cat){document.getElementById('saveImport').addEventListener('click',()=>{let f=document.getElementById('importForm');if(!f.reportValidity())return;let name=document.getElementById('name').value.trim();let qty=Number(document.getElementById('qty').value);let unit=document.getElementById('unit').value.trim();let total=Number(document.getElementById('price').value)||0;let unitPrice=qty>0?total/qty:0;let sup=document.getElementById('sup').value.trim();let note=document.getElementById('note')?.value.trim()||'';let expiry=document.getElementById('expiry')?.value||'';let date=document.getElementById('date').value||today();
let deductions=[];
if(cat==='thanhpham'){
  let recipe=recipes.find(r=>String(r.name||'').trim().toLowerCase()===name.toLowerCase());
  if(!recipe)return alert('Thành phẩm này chưa có công thức trong 🧮 Tính Cost. Hãy tạo Cost trước khi nhập thành phẩm.');
  let yieldQty=Math.max(1,Number(recipe.yield||1)), factor=qty/yieldQty;
  let usedNames=new Set();
  for(let it of (recipe.items||[])){
    let need=Number(it.qty||0)*factor;if(need<=0)continue;
    let m=stock.find(v=>(v.category==='nguyenlieu'||v.category==='dodung')&&v.name.toLowerCase()===String(it.name||'').toLowerCase());
    if(!m)return alert('Không tìm thấy nguyên liệu/vật tư "'+it.name+'" trong kho. Không thể nhập '+qty+' '+unit+' '+name+'.');
    let stockUnit=(m.unit||'').toLowerCase().trim(), recipeUnit=(it.unit||stockUnit).toLowerCase().trim();
    let converted=costForQty(m,need,recipeUnit);
    if(converted===null)return alert('Đơn vị của "'+m.name+'" không phù hợp: kho '+m.unit+' nhưng công thức dùng '+recipeUnit+'.');
    let base=unitToBase(need,recipeUnit);let needStock=baseToStock(base.base,stockUnit);
    if(needStock>Number(m.qty||0)+1e-9)return alert('Không đủ "'+m.name+'" trong kho. Cần '+need+' '+recipeUnit+', tương đương '+needStock+' '+m.unit+', nhưng chỉ còn '+m.qty+' '+m.unit+'.');
    deductions.push({m,qty:needStock,reason:'Tự động xuất theo Cost khi nhập '+name+' ('+qty+' '+unit+')'});usedNames.add(stock.indexOf(m));
  }
  let cups=stock.filter(v=>v.category==='dodung'&&/ly/i.test(String(v.name||'')));
  let cup=cups.find(v=>String(v.name||'').trim().toLowerCase()==='ly')||cups[0];
  if(cup && !usedNames.has(stock.indexOf(cup))){
    if(Number(cup.qty||0)<qty)return alert('Không đủ Ly trong kho đồ dùng. Cần xuất trước '+qty+' ly, nhưng '+cup.name+' chỉ còn '+cup.qty+' '+(cup.unit||'cái')+'.');
    deductions.push({m:cup,qty:qty,reason:'Tự động xuất Ly khi nhập '+name});
  }else if(!cup){return alert('Chưa có mặt hàng Ly trong kho đồ dùng. Hãy nhập Ly vào kho đồ dùng trước khi nhập thành phẩm.');}
}
for(let d of deductions){d.m.qty=Number(d.m.qty||0)-d.qty;hist.push({date,type:'Xuất/Sử dụng',name:d.m.name,qty:d.qty,unit:d.m.unit,category:d.m.category,note:d.reason});}
let x=stock.find(v=>v.category===cat&&v.name.toLowerCase()===name.toLowerCase());if(x){let oldQty=Number(x.qty||0);let oldTotal=Number(x.totalCost);if(!Number.isFinite(oldTotal))oldTotal=oldQty*Number(x.price||0);x.qty=oldQty+qty;if(unit)x.unit=unit;x.totalCost=oldTotal+total;x.price=x.qty>0?x.totalCost/x.qty:0;x.maxQty=Math.max(Number(x.maxQty||oldQty),x.qty);if(sup)x.sup=sup;if(expiry)x.expiry=expiry;if(note)x.note=note;}else{stock.push({name,qty,unit,price:unitPrice,totalCost:total,maxQty:qty,sup,expiry,note,category:cat});}
hist.push({date,type:'Nhập',name,qty,unit,category:cat,expiry,totalCost:total});
for(let d of deductions){if(d.m.qty<=0.0000001){let di=stock.indexOf(d.m);if(di>=0)stock.splice(di,1);}}
save();let autoMsg='';if(deductions.length){autoMsg=' | 🔄 Tự động xuất: '+deductions.map(d=>d.qty+' '+(d.m.unit||'đv')+' '+d.m.name).join(', ');}document.getElementById('msg').innerHTML='<p class="ok">✓ Đã nhập kho thành công: '+esc(name)+' — '+qty+' '+esc(unit)+' — '+total.toLocaleString('vi-VN')+' ₫'+autoMsg+'</p>';f.reset();document.getElementById('date').value=today();});}
function bindTransfer(){
const from=document.getElementById('fromCat');
const to=document.getElementById('toCat');
const sel=document.getElementById('transferItem');
function refresh(){
  sel.innerHTML='';
  stock.forEach((x,i)=>{
    if(x.category===from.value){
      const o=document.createElement('option');
      o.value=i; o.textContent=x.name+' — tồn '+Number(x.qty||0)+' '+(x.unit||'');
      sel.appendChild(o);
    }
  });
}
from.addEventListener('change',refresh);
refresh();
document.getElementById('saveTransfer').addEventListener('click',function(){
  const f=document.getElementById('transferForm');
  if(!f.reportValidity())return;
  const i=Number(sel.value), qty=Number(document.getElementById('transferQty').value);
  const fromCat=from.value, toCat=to.value, x=stock[i];
  const date=document.getElementById('transferDate').value||today();
  const note=document.getElementById('transferNote').value.trim();
  if(fromCat===toCat){alert('Kho chuyển đi và kho nhận phải khác nhau.');return;}
  if(!x||x.category!==fromCat){alert('Không tìm thấy mặt hàng.');return;}
  if(qty<=0||qty>Number(x.qty||0)){alert('Số lượng chuyển không hợp lệ. Tồn hiện tại: '+x.qty+' '+x.unit);return;}
  const oldQty=Number(x.qty||0);
  let oldTotal=Number(x.totalCost);
  if(!Number.isFinite(oldTotal))oldTotal=oldQty*Number(x.price||0);
  const movedCost=oldQty>0?oldTotal*(qty/oldQty):0;
  x.qty=oldQty-qty;
  x.totalCost=Math.max(0,oldTotal-movedCost);
  x.price=x.qty>0?x.totalCost/x.qty:0;
  const target=stock.find(v=>v.category===toCat&&v.name.toLowerCase()===x.name.toLowerCase()&&v.unit===x.unit);
  if(target){
    target.qty=Number(target.qty||0)+qty;
    target.totalCost=Number(target.totalCost||0)+movedCost;
    target.price=target.qty>0?target.totalCost/target.qty:0;
    if(!target.sup)target.sup=x.sup||'';
    if(!target.expiry)target.expiry=x.expiry||'';
  }else{
    stock.push({name:x.name,qty:qty,unit:x.unit,price:qty>0?movedCost/qty:0,totalCost:movedCost,sup:x.sup||'',expiry:x.expiry||'',note:x.note||'',category:toCat});
  }
  hist.push({date:date,type:'Chuyển kho',name:x.name,qty:qty,unit:x.unit,category:fromCat,note:(fromCat==='dodung'?'Đồ dùng':'Tài sản')+' → '+(toCat==='taisan'?'Tài sản':'Đồ dùng')+(note?' — '+note:'')});
  save();
  document.getElementById('msg').innerHTML='<p class="ok">✓ Đã chuyển '+qty+' '+esc(x.unit||'')+' '+esc(x.name)+' sang '+(toCat==='taisan'?'Tài sản':'Đồ dùng')+'</p>';
  refresh();
  document.getElementById('transferQty').value='';
});
}
function renderDailyExport(cat){let box=document.getElementById('dailyExportList');if(!box)return;let d=document.getElementById('outDate')?.value||today();let rows=hist.filter(h=>h.category===cat&&h.type==='Xuất/Sử dụng'&&h.date===d);let title=cat==='dodung'?'đồ dùng':cat==='taisan'?'tài sản':'nguyên liệu';if(!rows.length){box.innerHTML='<div class="note">📋 Hôm nay chưa có danh sách '+title+' đã xuất.</div>';return;}let total=rows.reduce((a,r)=>a+Number(r.qty||0),0);box.innerHTML='<h3>📋 Danh sách '+title+' đã xuất ngày '+esc(d)+'</h3><table><thead><tr><th>STT</th><th>Tên mặt hàng</th><th>Số lượng</th><th>Đơn vị</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(r.name)+'</td><td>'+r.qty+'</td><td>'+esc(r.unit||'')+'</td></tr>').join('')+'</tbody></table><div class="note"><b>Tổng số lượng xuất:</b> '+total+'</div>';}
function bindExport(cat){let b=document.getElementById('saveExport');if(!b)return;renderDailyExport(cat);document.getElementById('outDate')?.addEventListener('change',()=>renderDailyExport(cat));b.addEventListener('click',()=>{let f=document.getElementById('exportForm');if(!f.reportValidity())return;let i=Number(document.getElementById('item').value);let qty=Number(document.getElementById('outQty').value);let date=document.getElementById('outDate').value||today();let x=stock[i];if(!x||x.category!==cat)return alert('Không tìm thấy mặt hàng.');if(qty<=0||qty>x.qty)return alert('Số lượng xuất không hợp lệ. Tồn hiện tại: '+x.qty+' '+x.unit);x.qty-=qty;hist.push({date,type:'Xuất/Sử dụng',name:x.name,qty,unit:x.unit,category:cat});save();document.getElementById('msg').innerHTML='<p class="ok">✓ Đã xuất: '+esc(x.name)+' — '+qty+' '+esc(x.unit||'')+'</p>';f.reset();document.getElementById('outDate').value=date;renderDailyExport(cat);});}
function deleteStock(i){let x=stock[i];if(!x)return;let reason=prompt('Nhập lý do xoá mặt hàng "'+(x.name||'')+'":');if(reason===null)return;if(!reason.trim())return alert('Bắt buộc phải nhập lý do xoá.');let pass=prompt('Nhập mật khẩu quản lý để xoá:');if(pass===null)return;if(pass!=='123456')return alert('Mật khẩu không đúng. Không thể xoá.');hist.push({date:today(),type:'Xoá tồn kho',name:x.name,qty:x.qty,unit:x.unit,category:x.category,note:'Lý do: '+reason.trim()});stock.splice(i,1);save();show('stock');alert('Đã xoá "'+x.name+'" khỏi kho.');}
function moveStock(i){let x=stock[i];if(!x)return;let cats={nguyenlieu:'Nguyên liệu',dodung:'Đồ dùng',taisan:'Tài sản',thanhpham:'Thành phẩm'};let choices=Object.keys(cats).filter(c=>c!==x.category).map(c=>c+' = '+cats[c]).join('\n');let to=prompt('Chuyển "'+x.name+'" sang kho nào?\n'+choices);if(to===null)return;to=to.trim().toLowerCase();if(!cats[to]||to===x.category)return alert('Kho nhận không hợp lệ. Hãy nhập: '+Object.keys(cats).filter(c=>c!==x.category).join(', '));let qty=prompt('Số lượng chuyển (tối đa '+x.qty+' '+x.unit+'):',x.qty);if(qty===null)return;qty=Number(String(qty).replace(/[,\s]/g,''));if(!Number.isFinite(qty)||qty<=0||qty>Number(x.qty||0))return alert('Số lượng chuyển không hợp lệ.');let oldQty=Number(x.qty||0),oldTotal=Number(x.totalCost);if(!Number.isFinite(oldTotal))oldTotal=oldQty*Number(x.price||0);let movedCost=oldQty>0?oldTotal*(qty/oldQty):0;x.qty=oldQty-qty;x.totalCost=Math.max(0,oldTotal-movedCost);x.price=x.qty>0?x.totalCost/x.qty:0;let target=stock.find(v=>v.category===to&&v.name.toLowerCase()===x.name.toLowerCase()&&v.unit===x.unit);if(target){target.qty=Number(target.qty||0)+qty;target.totalCost=Number(target.totalCost||0)+movedCost;target.price=target.qty>0?target.totalCost/target.qty:0;if(!target.sup)target.sup=x.sup||'';if(!target.expiry)target.expiry=x.expiry||'';}else{stock.push({name:x.name,qty:qty,unit:x.unit,price:qty>0?movedCost/qty:0,totalCost:movedCost,maxQty:qty,sup:x.sup||'',expiry:x.expiry||'',note:x.note||'',category:to});}hist.push({date:today(),type:'Chuyển kho',name:x.name,qty,unit:x.unit,category:x.category,note:cats[x.category]+' → '+cats[to]});if(x.qty<=0.0000001)stock.splice(i,1);save();show('stock');alert('Đã chuyển '+qty+' '+x.unit+' '+x.name+' sang kho '+cats[to]+'.'+(x.qty<=0.0000001?' Mặt hàng đã tự động xoá khỏi kho cũ.':''));}
function adjust(i){let x=stock[i];if(!x)return;let newName=prompt('Sửa tên mặt hàng:',x.name||'');if(newName===null)return;newName=newName.trim();if(!newName)return alert('Tên mặt hàng không được để trống');let v=prompt('Nhập số tồn thực tế cho: '+newName,x.qty);if(v===null)return;v=Number(String(v).replace(/[,.\s]/g,''));if(!Number.isFinite(v)||v<0)return alert('Số tồn không hợp lệ');let unit=prompt('Nhập đơn vị cho: '+x.name,x.unit||'');if(unit===null)return;unit=unit.trim();if(!unit)return alert('Đơn vị không được để trống');let oldTotal=Number(x.totalCost);if(!Number.isFinite(oldTotal))oldTotal=Number(x.qty||0)*Number(x.price||0);let price=prompt('Nhập TỔNG GIÁ TRỊ của số tồn hiện tại (VNĐ). Ví dụ 5000g = 110000:',Math.round(oldTotal));if(price===null)return;price=Number(String(price).replace(/[,.\s₫]/g,''));if(!Number.isFinite(price)||price<0)return alert('Giá trị không hợp lệ');let expiry=prompt('Nhập hạn sử dụng (YYYY-MM-DD), để trống nếu không có:',x.expiry||'');if(expiry===null)return;let sup=prompt('Nhập nhà cung cấp:',x.sup||'');if(sup===null)return;x.name=newName;x.qty=v;x.unit=unit;x.totalCost=price;x.price=v>0?price/v:0;x.expiry=expiry.trim();x.sup=sup.trim();save();show('stock');}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.page)));show('home');
</script></body></html>
